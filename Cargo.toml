[workspace]
resolver = "2"
members = ["crates/unarc-rs", "crates/unarc-cli"]

[workspace.package]
version = "0.7.2"
edition = "2021"
# delharc 0.8 requires Rust 1.95
rust-version = "1.95"
authors = ["Mike Krüger <mkrueger@posteo.de>"]
homepage = "https://github.com/mkrueger/unarc-rs"
repository = "https://github.com/mkrueger/unarc-rs"
license = "MIT OR Apache-2.0"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
unwrap_used = "warn"
