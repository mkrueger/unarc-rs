name: Dependency checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Weekly, to catch new RustSec advisories without a code change
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  cargo-deny:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        checks:
          - advisories
          - bans licenses sources
    # A newly published advisory should not block unrelated pull requests
    continue-on-error: ${{ matrix.checks == 'advisories' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
