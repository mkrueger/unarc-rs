[package]
name = "unarc-rs"
version.workspace = true
edition.workspace = true
description = "Universal archive extraction & decompression library for retro + modern formats (7z, ZIP, RAR, LHA/LZH, TAR, ARJ, ARC/PAK, ZOO, HA, UC2, SQ/SQ2, SQZ, HYP, gz, bz2, Z)."
authors.workspace = true
homepage.workspace = true
repository.workspace = true
license.workspace = true
exclude = ["src/**/exe/**", "src/**/disasm/**"]

[dependencies]
log = "0.4.33"
crc32fast = "1.5.0"
crc16 = "0.4.0"
chrono = "0.4.45"
delharc = "0.8.0"
salzweg = "0.1.4"
bitstream-io = "4.10.0"
# zip's default features except "zstd", which builds the C zstd library (see the `zstd` feature)
zip = { version = "8.6.0", default-features = false, features = [
    "legacy-zip",
    "aes-crypto",
    "bzip2",
    "deflate",
    "deflate64",
    "lzma",
    "ppmd",
    "time",
    "xz",
] }
rars = "0.9.4"
sevenz-rust2 = "0.22.2"
thiserror = "2.0"
tar = "0.4"
flate2 = "1.1"
bzip2 = "0.6"
blowfish = "0.10.0"
byteorder = "1.5"
sha-1 = "0.10"

[dev-dependencies]
pretty_assertions = "1.4.1"

[features]
default = ["zstd"]
# Zstandard compressed ZIP entries. Requires a C compiler (zstd-sys); disable for a pure Rust build, e.g. for wasm32.
zstd = ["zip/zstd"]
